# ============================================
# Deploy Workflow - Auto-deploy on master merge
# ============================================
name: 🚀 Deploy to Production

on:
  push:
    branches:
      - develop  # Auto-deploy when pushed to develop

jobs:
  build:
    name: Build Backend JAR
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 📦 Build JAR (skip tests)
        run: mvn clean package -DskipTests -q

      - name: 📤 Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/*.jar

  deploy:
    name: Deploy to AWS EC2
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: 📥 Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: ./artifact

      - name: 🔑 Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 📤 Upload JAR to EC2
        run: |
          scp -i ~/.ssh/deploy_key \
            ./artifact/*.jar \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/hrms-backend.jar

      - name: 🚀 Deploy Backend
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'DEPLOY'
            echo "🛑 Stopping HRMS service..."
            sudo systemctl stop hrms
            
            echo "📦 Backing up current JAR..."
            sudo cp /opt/hrms/hrms-backend-0.0.1-SNAPSHOT.jar /opt/hrms/hrms-backend-backup.jar 2>/dev/null || true
            
            echo "🔄 Deploying new JAR..."
            sudo mv /tmp/hrms-backend.jar /opt/hrms/hrms-backend-0.0.1-SNAPSHOT.jar
            sudo chown ubuntu:ubuntu /opt/hrms/hrms-backend-0.0.1-SNAPSHOT.jar
            
            echo "🚀 Starting HRMS service..."
            sudo systemctl start hrms
            
            echo "⏳ Waiting for startup..."
            sleep 15
            
            echo "✅ Deployment complete!"
          DEPLOY

      - name: 🏥 Health Check
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            'curl -sf http://localhost:8080/api/health || exit 1'
          echo "✅ Backend is healthy!"

      - name: 📢 Deployment Summary
        run: |
          echo "🎉 Backend deployed successfully!"
          echo "📍 Server: ${{ secrets.EC2_HOST }}"
          echo "🕐 Time: $(date)"
