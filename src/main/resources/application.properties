# =====================================================
# HRMS Backend Configuration
# =====================================================

server.port=8080

# ============ Database ============
spring.datasource.url=jdbc:mysql://localhost:3307/payroll_hrms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Pswd@vtx0

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============ JWT Configuration ============
# Secret key for signing JWT tokens (min 64 chars for HS512)
jwt.secret=hrms-super-secret-key-that-is-at-least-256-bits-long-for-hs512-security-production-change-this

# Access token expiry (15 minutes = 900000 ms)
jwt.access-token-expiry-ms=900000

# Refresh token expiry (7 days = 604800000 ms)
jwt.refresh-token-expiry-ms=604800000

# ============ CORS ============
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:5174

# ============ API Documentation ============
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger

# ============ Logging ============
logging.level.com.example.hrms.auth=DEBUG
logging.level.org.springframework.security=INFO

# ============ Application Settings ============
app.name=ChandraHR
app.base-url.frontend=http://localhost:5173
app.base-url.backend=http://localhost:8080

# ============ Email Configuration (Gmail SMTP) ============
# IMPORTANT: Use Gmail App Password, NOT your regular password
# Steps to get App Password:
# ============ ZOHO MAIL CONFIGURATION ============
# Using Zoho Mail for chandrahr.in domain
# 1. Login to Zoho Mail Admin Console
# 2. Go to accounts.zoho.com -> Security -> App Passwords
# 3. Generate an App Password for "HRMS Application"
# 4. Use that password below

spring.mail.host=smtp.zoho.in
spring.mail.port=587
# noreply@chandrahr.in - ChandraHR Support account
spring.mail.username=noreply@chandrahr.in
# App Password: ChandraHR (generated from Zoho Account)
spring.mail.password=EmS4fjhu6q8G

# Sender display name and email
app.mail.from-name=ChandraHR
app.mail.from-email=noreply@chandrahr.in

# Mail properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Enable async for email sending
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
