# =====================================================
# HRMS Backend Configuration (Common/Default)
# =====================================================
# Profiles:
#   - dev: Local development (application-dev.properties)
#   - prod: Production on AWS (application-prod.properties)
#
# Run locally: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# Or set in IDE: spring.profiles.active=dev

# Default profile for local development
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=8080

# ============ Database ============
# Default profile uses environment variables, override in application-dev.properties for local
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/payroll_hrms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============ JWT Configuration ============
# Secret key for signing JWT tokens (min 64 chars for HS512)
jwt.secret=hrms-super-secret-key-that-is-at-least-256-bits-long-for-hs512-security-production-change-this

# Access token expiry (30 minutes = 1800000 ms)
jwt.access-token-expiry-ms=1800000

# Refresh token expiry (7 days = 604800000 ms)
jwt.refresh-token-expiry-ms=604800000

# ============ CORS ============
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:5174

# ============ API Documentation ============
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger

# ============ Logging ============
logging.level.com.example.hrms.auth=DEBUG
logging.level.org.springframework.security=INFO

# ============ Application Settings ============
app.name=ChandraHR
app.base-url.frontend=http://localhost:5173
app.base-url.backend=http://localhost:8080

# ============ Email Configuration (Gmail SMTP) ============
# For production, set these via environment variables or application-prod.properties

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}

# Sender display name and email
app.mail.from-name=ChandraHR
app.mail.from-email=${MAIL_FROM:your-email@gmail.com}

# Mail properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Enable async for email sending
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
